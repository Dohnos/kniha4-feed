# Po každém nahrání na GitHub sestaví Astro web a zveřejní ho na GitHub Pages.
# Feed (public/zbozi.xml, public/zbozitest.xml) jde na web beze změny, na stejnou adresu.
#
# Jednorázové nastavení: Settings → Pages → Source: „GitHub Actions“,
# Custom domain: kniha4u.cz + Enforce HTTPS. Soubor CNAME v kořeni repozitáře si spravuje GitHub sám.

name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sestaveni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  zverejneni:
    needs: sestaveni
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v5
